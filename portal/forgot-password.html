<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Password | WEMACOOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><main class="auth-layout"><section class="auth-brand"><div class="auth-brand-inner"><h1>Recover access <em>securely.</em></h1><p>Password reset instructions are sent only to the email address registered on your cooperative account.</p></div></section><section class="auth-main"><div class="auth-card"><a class="auth-logo" href="login.html"><img src="../assets/wema-mark.webp" alt=""><div><strong>WEMACOOP</strong><span>Password Recovery</span></div></a><div id="forgotStep"><h2>Forgot password?</h2><p class="auth-intro">Enter your registered email or membership number.</p><form id="forgotForm"><div class="field"><label>Email or membership number</label><input id="forgotIdentifier" required></div><button class="primary-action">Send reset instructions</button><div id="forgotMessage" class="form-message"></div></form></div><div id="resetStep" class="hidden"><h2>Set a new password</h2><form id="resetForm"><div class="field"><label>Reset token</label><input id="resetToken" required></div><div class="field"><label>New password</label><input id="resetPasswordValue" type="password" minlength="10" required></div><button class="primary-action">Reset password</button><div id="resetMessage" class="form-message"></div></form></div><div class="auth-separator">Remembered it?</div><a class="secondary-action" href="login.html">Back to sign in</a></div></section></main><script src="config.js"></script><script src="auth.js"></script><script>forgotForm.addEventListener('submit',async e=>{e.preventDefault();try{const r=await PortalApi.forgot({identifier:forgotIdentifier.value.trim()});showMessage(forgotMessage,r.message,'success');forgotStep.classList.add('hidden');resetStep.classList.remove('hidden');if(r.developmentToken)resetToken.value=r.developmentToken}catch(err){showMessage(forgotMessage,err.message)}});resetForm.addEventListener('submit',async e=>{e.preventDefault();try{const r=await PortalApi.resetPassword({identifier:forgotIdentifier.value.trim(),token:resetToken.value.trim(),password:resetPasswordValue.value});showMessage(resetMessage,r.message,'success');setTimeout(()=>location.href='login.html',1200)}catch(err){showMessage(resetMessage,err.message)}});</script></body></html>
